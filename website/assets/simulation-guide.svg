<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-labelledby="title desc"><title id="title">Review a simulation model pin mapping</title><desc id="desc">Illustrative diode example: select a model, review the mapping, check and apply. Terminal order depends on the actual model.</desc><rect width="680" height="300" rx="8" fill="#292d31"/><g font-family="Segoe UI,Arial,sans-serif"><text x="24" y="35" fill="#f0f2f4" font-size="21" font-weight="600">Prepare a simulation model</text><text x="24" y="70" fill="#69b7e8" font-size="18">Choose model → Map pins → Check → Apply</text><path d="M24 91H656" stroke="#535d66"/><text x="36" y="121" fill="#bbc3cb" font-size="16">Model terminal</text><text x="397" y="121" fill="#bbc3cb" font-size="16">KiCad symbol pin</text><rect x="24" y="139" width="632" height="45" rx="5" fill="#2b2f33"/><text x="36" y="168" fill="#f0f2f4" font-size="19">A · Anode</text><path d="M245 161H350m-8-6 8 6-8 6" stroke="#62c5b4" fill="none" stroke-width="2"/><text x="397" y="168" fill="#f0f2f4" font-size="19">2 · Anode</text><rect x="24" y="191" width="632" height="45" rx="5" fill="#2b2f33"/><text x="36" y="220" fill="#f0f2f4" font-size="19">K · Cathode</text><path d="M245 213H350m-8-6 8 6-8 6" stroke="#62c5b4" fill="none" stroke-width="2"/><text x="397" y="220" fill="#f0f2f4" font-size="19">1 · Cathode</text><text x="24" y="268" fill="#bbc3cb" font-size="15">Example only. Verify your symbol, model terminal order and datasheet.</text></g></svg>
