<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" viewBox="0 0 640 230" role="img" aria-labelledby="title desc"><title id="title">Copy a KiCad library reference</title><desc id="desc">Illustration: copy Diode:1N4148W in Parts Manager, then use A in the KiCad schematic editor to find the symbol.</desc><rect width="640" height="230" rx="8" fill="#292d31"/><g font-family="Segoe UI,Arial,sans-serif"><text x="24" y="36" fill="#f0f2f4" font-size="21" font-weight="600">Use in KiCad</text><text x="24" y="72" fill="#bbc3cb" font-size="15">Library reference</text><rect x="24" y="86" width="394" height="44" rx="5" fill="#2b2f33" stroke="#535d66"/><text x="40" y="114" fill="#f0f2f4" font-size="19">Diode:1N4148W</text><rect x="436" y="86" width="180" height="44" rx="5" fill="#294c60" stroke="#69b7e8"/><text x="526" y="114" text-anchor="middle" fill="#f0f2f4" font-size="17">Copy reference</text><rect x="24" y="154" width="38" height="38" rx="5" fill="#2b2f33" stroke="#69b7e8"/><text x="43" y="180" text-anchor="middle" fill="#69b7e8" font-size="23">A</text><text x="80" y="174" fill="#f0f2f4" font-size="17">In the KiCad schematic editor, press A.</text><text x="80" y="200" fill="#bbc3cb" font-size="15">Search for the reference. Check the symbol and footprint.</text></g></svg>
